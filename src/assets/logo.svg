<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <linearGradient id="starHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#A5B4FC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0D0D12" />

  <circle cx="200" cy="200" r="160" fill="url(#glow)" />

  <g transform="translate(100, 100)">
    
    <circle cx="100" cy="100" r="75" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-dasharray="35 12" filter="url(#neonGlow)"/>
    <circle cx="100" cy="100" r="86" fill="none" stroke="#4F46E5" stroke-width="1" stroke-opacity="0.3" />

    <circle cx="100" cy="25" r="3.5" fill="#CCFF00" filter="url(#neonGlow)"/>
    <circle cx="175" cy="100" r="3.5" fill="#CCFF00" filter="url(#neonGlow)"/>
    <circle cx="100" cy="175" r="3.5" fill="#CCFF00" filter="url(#neonGlow)"/>
    <circle cx="25" cy="100" r="3.5" fill="#CCFF00" filter="url(#neonGlow)"/>

    <path d="M 100 10
             C 100 55, 110 90, 190 100
             C 110 110, 100 145, 100 190
             C 100 145, 90 110, 10 100
             C 90 90, 100 55, 100 10 Z"
          fill="url(#brandGrad)" filter="url(#neonGlow)"/>

    <path d="M 100 25
             C 100 65, 105 85, 170 100
             C 105 115, 100 135, 100 175
             C 100 135, 95 115, 30 100
             C 95 85, 100 65, 100 25 Z"
          fill="url(#starHighlight)" />
  </g>

  <g transform="translate(360, 215)" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif">
    <text x="0" y="0" fill="#FFFFFF" font-size="76" letter-spacing="0.5">
      <tspan font-weight="800">Pole</tspan><tspan font-weight="300" fill="#E2E8F0">Star</tspan>
    </text>
    
    <text x="5" y="40" fill="#8B8D98" font-size="14" font-weight="600" letter-spacing="5">
      AI BUSINESS OPERATING SYSTEM
    </text>
  </g>
</svg>
